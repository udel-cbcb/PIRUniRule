<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<title>Online Prediction Service - Retrieve Results</title>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />

<link href="../../../resources/css/core.css" rel="stylesheet"
	media="screen" th:href="@{/resources/css/core.css}" />

<link href="../../../resources/css/cerulean.min.css" rel="stylesheet"
	media="screen" th:href="@{/resources/css/cerulean.min.css}" />

<link href="../../../resources/css/custom.css" rel="stylesheet"
	media="screen" th:href="@{/resources/css/custom.css}" />

<link href="../../../resources/css/dataTables.bootstrap.min.css" rel="stylesheet"
	media="screen" th:href="@{/resources/css/dataTables.bootstrap.min.css}" />

<script src="../../resources/js/jquery-latest.js" th:src="@{/resources/js/jquery-latest.js}"></script>

<script src="../../../resources/js/bootstrap.min.js"
	th:src="@{/resources/js/bootstrap.min.js}"></script>

<script src="../../../resources/js/jquery.dataTables.min.js"
	th:src="@{/resources/js/jquery.dataTables.min.js}" type="text/javascript"></script>

<script src="../../../resources/js/dataTables.bootstrap.min.js"
	th:src="@{/resources/js/dataTables.bootstrap.min.js}" type="text/javascript"></script>

<script src="js/PIRSitePredict.js"
	th:src="@{/resources/js/PIRSitePredict.js}" type="text/javascript"></script>

<!-- HTML5 shim and Respond.js IE8 support of HTML5 elements and media queries -->
<!--[if lt IE 9]>
  <script src="https://oss.maxcdn.com/libs/html5shiv/3.7.0/html5shiv.js"></script>
  <script src="https://oss.maxcdn.com/libs/respond.js/1.3.0/respond.min.js"></script>
  <![endif]-->
</head>
<body>
	<div class="container-fluid" th:with="baseUrl='~/PIRSitePredict'">
		<div th:replace="fragments/header :: header">Header</div>
		<div class="row row-padded">

			<th:block th:if="${jobIdError != null}">
				<div class="alert alert-danger" th:if="${jobIdError}">
					<ul>
						<li th:text="${jobIdError}">Form contains error, please try
							again.</li>
					</ul>
				</div>
			</th:block>
			<th:block th:if="${jobIdError == null}">
				<br />
				<fieldset>
					<legend>
						Job ID: <b th:text="${jobId}"></b>, PIRSitePredict: <b
							th:text="${release}"></b>
					</legend>
					<div class="row-fluid">

						<br />
						<div>
							<a class="btn btn-default" th:href="@{/prediction/ajax/export/__${jobId}__/tsv}">TSV</a>
							<a class="btn btn-default" th:href="@{/prediction/ajax/export/__${jobId}__/xml}">XML</a>
							<a class="btn btn-default" th:href="@{/prediction/ajax/export/__${jobId}__/gff3}">GFF3</a>
						</div>
						<table id="reportsTable"
							class="table table-striped table-condensed table-bordered" style="width:100%;">

							<thead>
								<tr>
									<th>PIRSR</th>
									<th>Protein ID</th>
									<th>Start</th>
									<th>End</th>
									<th>Type</th>
									<th>Category</th>
									<th>Description</th>
									<th>Nucleotide ID</th>
									<th>ORF Start</th>
									<th>ORF End</th>
									<th>ORF Strand</th>
								</tr>
							</thead>

						</table>

					</div>

				</fieldset>
			</th:block>
		</div>
		<div class="row">
			<div th:replace="fragments/footer :: footer">&copy; 2015
				Protein Information Resource</div>
		</div>
	</div>
	<script th:inline="javascript">
		jQuery(document).ready(function($) {
			var reportsUrl = /*[[@{/prediction/ajax/reports/__${jobId}__}]]*/ '/prediction/ajax/reports/JOBID';
			$('#reportsTable').DataTable({
				processing : true,
				serverSide : true,
				ajax : reportsUrl,
				pageLength : 25,
				autoWidth : false,
				columns : [ {
					data : 'pirsrId',
					name : 'pirsrId',
					render : ruleCentralView
				}, {
					data : 'proteinId',
					name : 'proteinId',
					render : proteinCentralView
				}, {
					data : 'start',
					name : 'start'
				}, {
					data : 'end',
					name : 'end'
				}, {
					data : 'type',
					name : 'type'
				}, {
					data : 'category',
					name : 'category'
				}, {
					data : 'description',
					name : 'description'
				}, {
					data : 'nucleotideId',
					name : 'nucleotideId',
					render : nucleotideCentralView
				}, {
					data : 'nucleotideORFStart',
					name : 'nucleotideORFStart'
				}, {
					data : 'nucleotideORFEnd',
					name : 'nucleotideORFEnd'
				}, {
					data : 'nucleotideORFStrand',
					name : 'nucleotideORFStrand'
				} ]
			});
		});
	</script>
</body>
</html>
